name: Tests

# Yayınlama Vercel'in GitHub entegrasyonu ile yapılır; bu workflow yalnızca testleri çalıştırır
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install "torch==$(grep '^torch==' requirements.txt | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      # Node.js runner'da hazır gelir; tarayıcı modelinin PyTorch ile aynı sonucu verdiği de test edilir
      - run: python -m pytest
